server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Este container é publicado pelo nginx dos microservices em /app/portfolio/.
    location = /app/portfolio {
        return 302 /app/portfolio/;
    }

    location = /app {
        return 302 /app/portfolio/;
    }

    location = / {
        return 302 /app/portfolio/;
    }

    location /app/portfolio/ {
        try_files $uri $uri/index.html /app/portfolio/index.html;
    }

    location ~* ^/app/portfolio/assets/.+\.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
